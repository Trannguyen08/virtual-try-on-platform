[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-try-on-platform"
version = "0.1.0"
description = "AI-powered 3D Virtual Try-On & Fit Recommendation Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.4.0",
    "trimesh>=4.0.0",
    "psutil>=5.9.0",
    "colorama>=0.4.6",
    "cloudpickle>=3.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
