[pytest]
minversion = 8.0
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "fast: Fast tests suitable for CI execution",
    "slow: Heavy tests requiring long computation or heavy simulation (skipped in CI)",
    "gpu: Tests requiring CUDA/GPU hardware (skipped in CI)",
    "integration: Cross-module integration tests"
]
addopts = "-ra -q"
